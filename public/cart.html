<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cart | YT_Boquets_ReturnGifts</title>
<link rel="stylesheet" href="/css/style.css">
<script src="/js/app.js"></script>
</head>
<body>
<main>
<h1>Your Cart</h1><div id="cart"><p>Loading…</p></div>
</main>
<script>

let products = [];
function render() {
  const cart = Cart.get();
  const rows = products.filter((p) => cart[p.id] > 0);
  if (!rows.length) {
    $("#cart").innerHTML = `<p>Your cart is empty.</p><a class="btn" href="/">Shop Products</a>`;
    return;
  }
  const total = rows.reduce((s, p) => s + p.price * cart[p.id], 0);
  $("#cart").innerHTML = `
  <table><tr><th>Product</th><th>Price</th><th>Qty</th><th>Subtotal</th></tr>
  ${rows.map((p) => `<tr><td>${esc(p.name)}</td><td>${money(p.price)}</td>
    <td><input type="number" min="0" data-id="${p.id}" value="${cart[p.id]}"></td>
    <td>${money(p.price * cart[p.id])}</td></tr>`).join("")}
  </table>
  <button class="btn secondary" id="update">Update Cart</button>
  <h2>Total: ${money(total)}</h2>
  <a class="btn" href="/checkout.html">Proceed to Checkout</a>`;
  $("#update").onclick = () => {
    const c = {};
    document.querySelectorAll("input[data-id]").forEach((i) => { const q = parseInt(i.value, 10); if (q > 0) c[i.dataset.id] = q; });
    Cart.set(c); render();
  };
}
api("products").then((p) => { products = p; render(); }).catch(() => { $("#cart").innerHTML = "<p class=\"error\">Could not load cart.</p>"; });
</script>
</body>
</html>
