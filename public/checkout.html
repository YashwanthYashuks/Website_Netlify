<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Checkout | YT_Boquets_ReturnGifts</title>
<link rel="stylesheet" href="/css/style.css">
<script src="/js/app.js"></script>
</head>
<body>
<main>
<h1>Checkout</h1>
<form class="form" id="form">
<label>Full Name *<input name="name" required></label>
<label>Mobile / WhatsApp Number *<input name="phone" required></label>
<label>Email<input type="email" name="email"></label>
<label>Full Delivery Address *<textarea name="address" required></textarea></label>
<label>City<input name="city" value="Bangalore"></label>
<label>Pincode<input name="pincode" value="560048"></label>
<label>Preferred Delivery Date<input type="date" name="delivery_date"></label>
<label>Special Instructions<textarea name="special_instructions" placeholder="Event date, customization, color preference, etc."></textarea></label>
<h2>Total: <span id="total">…</span></h2>
<p class="note">Payment: Cash/UPI after order confirmation. We will contact you on WhatsApp to confirm the order and payment.</p>
<p class="error" id="err"></p>
<button class="btn" type="submit" id="submit">Place Order</button>
</form>
</main>
<script>

const cart = Cart.get();
if (!Object.keys(cart).length) location.replace("/cart.html");
api("products").then((ps) => {
  $("#total").textContent = money(ps.reduce((s, p) => s + p.price * (cart[p.id] || 0), 0));
});
$("#form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const f = Object.fromEntries(new FormData(e.target));
  $("#submit").disabled = true; $("#err").textContent = "";
  try {
    const r = await api("orders", { method: "POST", body: {
      customer: { name: f.name, phone: f.phone, email: f.email, address: f.address, city: f.city, pincode: f.pincode },
      items: Object.entries(cart).map(([id, qty]) => ({ id, qty })),
      delivery_date: f.delivery_date, special_instructions: f.special_instructions,
    }});
    Cart.clear();
    location.href = `/confirmation.html?order=${encodeURIComponent(r.order_number)}&total=${r.total}`;
  } catch (err) {
    $("#err").textContent = err.message; $("#submit").disabled = false;
  }
});
</script>
</body>
</html>
