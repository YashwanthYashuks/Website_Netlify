<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bouquets & Return Gifts | YT_Boquets_ReturnGifts</title>
<link rel="stylesheet" href="/css/style.css">
<script src="/js/app.js"></script>
</head>
<body>
<main>
<section class="hero">
  <h1>Beautiful Bouquets &amp; Return Gifts</h1>
  <p>Special gifts for weddings, birthdays, functions and every celebration.</p>
  <a class="btn" href="#products">Shop Now</a>
</section>

<section id="products">
  <h2>Our Products</h2>
  <div class="grid" id="grid"><p>Loading products…</p></div>
</section>

<section class="bulk">
  <h2>Bulk Return Gift Orders</h2>
  <p>Need 50, 100, 200+ gifts? Contact us on WhatsApp for custom pricing and designs.</p>
  <a class="btn whatsapp" id="bulk-link" target="_blank" rel="noopener noreferrer">Enquire on WhatsApp</a>
</section>
</main>
<script>

$("#bulk-link").href = `https://wa.me/${CONFIG.whatsapp}?text=` + encodeURIComponent("Hi YT_Boquets_ReturnGifts, I need a bulk return gift order.");
api("products").then((products) => {
  $("#grid").innerHTML = products.map((p) => `
    <div class="card">
      <div class="photo">${photoHtml(p)}</div>
      <h3>${esc(p.name)}</h3>
      <p>${esc(p.description)}</p>
      <div class="price">${money(p.price)}</div>
      <a class="btn secondary" href="/product.html?id=${p.id}">View</a>
      <button class="btn" data-id="${p.id}">Add to Cart</button>
    </div>`).join("") || "<p>No products available.</p>";
}).catch(() => { $("#grid").innerHTML = "<p class=\"error\">Could not load products.</p>"; });

$("#grid").addEventListener("click", (e) => {
  const b = e.target.closest("button[data-id]");
  if (b) { Cart.add(b.dataset.id, 1); flash("Product added to cart."); }
});
</script>
</body>
</html>
