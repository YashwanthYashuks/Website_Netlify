<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Product | YT_Boquets_ReturnGifts</title>
<link rel="stylesheet" href="/css/style.css">
<script src="/js/app.js"></script>
</head>
<body>
<main>
<div id="detail"><p>Loading…</p></div>
</main>
<script>

const id = new URLSearchParams(location.search).get("id");
api("products/" + encodeURIComponent(id)).then((p) => {
  document.title = p.name + " | " + CONFIG.businessName;
  $("#detail").innerHTML = `
  <div class="product-detail">
    <div class="photo big">${photoHtml(p, "🌸")}</div>
    <div>
      <h1>${esc(p.name)}</h1>
      <p>${esc(p.description)}</p>
      <h2>${money(p.price)}</h2>
      <label>Quantity <input type="number" id="qty" value="1" min="1"></label>
      <button class="btn" id="add">Add to Cart</button>
    </div>
  </div>`;
  $("#add").onclick = () => { Cart.add(p.id, parseInt($("#qty").value, 10) || 1); flash("Product added to cart."); };
}).catch(() => { $("#detail").innerHTML = "<p class=\"error\">Product not found.</p><a class=\"btn\" href=\"/\">Back to shop</a>"; });
</script>
</body>
</html>
